[project]
name = "fh1-mapdecomp"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
fh1-mapdecomp = "fh1_mapdecomp.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fh1_mapdecomp*"]
